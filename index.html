<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="https://games.pikabu.ru/sdk/sdk.js"></script>
    <script src="./pikabu-bridge.js"></script>
<script src="./playgama-yandex-shim.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1b3a">
<title>Бум-блок: снос домов</title>
<link rel="stylesheet" href="styles/ui.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ============ ЗАГРУЗКА ============ -->
  <div id="screen-loading" class="screen active">
    <div class="load-wrap">
      <div class="load-logo">
        <span class="logo-a" data-i18n="game.title">БУМ</span>
        <span class="logo-b" data-i18n="game.subtitle">БЛОК!</span>
      </div>
      <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
      <div class="load-text" id="load-text">…</div>
    </div>
  </div>

  <!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
  <div id="screen-menu" class="screen">
    <div class="menu-title">
      <span class="logo-a" data-i18n="game.title">БУМ</span>
      <span class="logo-b" data-i18n="game.subtitle">БЛОК!</span>
    </div>
    <div class="menu-buttons">
      <button class="btn btn-xl btn-green" data-act="play" data-i18n="menu.play">Играть</button>
      <button class="btn btn-lg btn-blue" data-act="levels" data-i18n="menu.levels">Уровни</button>
      <button class="btn btn-lg btn-gold" data-act="shop" data-i18n="menu.shop">Мастерская</button>
      <button class="btn btn-lg btn-blue" data-act="settings" data-i18n="menu.settings">Настройки</button>
    </div>
    <div class="menu-foot">
      <div class="stat-pill"><span class="ico ico-star"></span><span id="menu-stars">0</span><span class="dim">/90</span></div>
      <div class="stat-pill"><span class="ico ico-gem"></span><span id="menu-gems">0</span></div>
    </div>
    <button class="btn-icon btn-mute" data-act="mute" data-i18n-title="menu.sound"><span id="mute-ico">🔊</span></button>
  </div>

  <!-- ============ ВЫБОР УРОВНЯ ============ -->
  <div id="screen-levels" class="screen">
    <div class="ls-top">
      <button class="btn-icon btn-back" data-act="menu">◀</button>
      <div class="ls-banner"><span id="ls-title">—</span></div>
      <button class="btn-icon btn-list" data-act="grid">☰</button>
    </div>
    <div class="ls-arrow ls-left" data-act="prev">
      <svg viewBox="0 0 40 60"><path d="M32 4 L10 30 L32 56" /></svg>
    </div>
    <div class="ls-arrow ls-right" data-act="next">
      <svg viewBox="0 0 40 60"><path d="M8 4 L30 30 L8 56" /></svg>
    </div>
    <div class="ls-bottom">
      <div class="ls-info">
        <div class="ls-name" id="ls-name">—</div>
        <div class="ls-stars" id="ls-stars"></div>
      </div>
      <button class="btn btn-xl btn-green" id="ls-play" data-act="start" data-i18n="ls.play">Играть</button>
      <div class="ls-locked" id="ls-locked"><span class="lock">🔒</span> <span data-i18n="ls.locked">Пройди предыдущий уровень</span></div>
    </div>
    <div class="ls-grid-overlay" id="ls-grid-overlay">
      <div class="panel panel-wide">
        <div class="panel-head" data-i18n="ls.all">Все уровни</div>
        <div class="lvl-grid" id="lvl-grid"></div>
        <button class="btn btn-md btn-blue" data-act="closegrid" data-i18n="ls.close">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- ============ МАСТЕРСКАЯ ============ -->
  <div id="screen-shop" class="screen">
    <div class="shop-top">
      <button class="btn-icon btn-back" data-act="menu">◀</button>
      <div class="shop-title" data-i18n="shop.title">Мастерская</div>
      <div class="shop-gems"><span id="shop-gems">0</span><span class="ico ico-gem"></span></div>
    </div>
    <div class="shop-panel">
      <div class="shop-tabs">
        <button class="shop-tab on" data-tab="explosives" data-i18n="shop.tab.explosives">Взрывчатка</button>
        <button class="shop-tab" data-tab="player" data-i18n="shop.tab.player">Игрок</button>
      </div>
      <div class="shop-list" id="shop-list"></div>
      <button class="btn btn-md btn-gold shop-ad btn-ad" data-act="adgems">
        <span class="ad-mark" data-i18n="ad.mark">Реклама</span>
        <span data-i18n="ad.watch">Смотреть рекламу</span>
        <span class="reward-chip">+50<span class="ico ico-gem"></span></span>
      </button>
    </div>
  </div>

  <!-- ============ HUD ============ -->
  <div id="hud" class="screen hud">
    <div class="hud-tl">
      <div class="hud-chip hud-crystals">
        <span class="lbl" data-i18n="hud.found">Найдено</span>
        <span class="val"><span id="hud-found">0</span>/<span id="hud-total">5</span></span>
        <span class="ico ico-gem" id="hud-gem-target"></span>
      </div>
      <div class="hud-chip hud-charges">
        <span class="ico-tnt"></span><span id="hud-charges">3</span>
        <span class="lbl" data-i18n="hud.charges">зарядов</span>
      </div>
      <div class="hud-row">
        <button class="btn-icon btn-pause" data-act="pause">❚❚</button>
        <button class="btn-icon btn-restart" data-act="restart">⟲</button>
      </div>
    </div>

    <div class="hud-tc">
      <div class="hud-level" id="hud-level">—</div>
      <div class="hud-hint" id="hud-hint"></div>
    </div>

    <div class="hud-tr">
      <div class="hud-chip hud-score"><span id="hud-score">0</span><span class="dim" data-i18n="hud.score">очков</span></div>
      <div class="hud-chip hud-gems"><span id="hud-gems">0</span><span class="ico ico-gem"></span></div>
    </div>

    <div class="combo-stack" id="combo-stack"></div>

    <div class="crosshair" id="crosshair">
      <div class="ch-dot"></div>
      <div class="ch-arm ch-t"></div><div class="ch-arm ch-b"></div>
      <div class="ch-arm ch-l"></div><div class="ch-arm ch-r"></div>
    </div>

    <div class="hotbar" id="hotbar"></div>

    <div class="tutorial" id="tutorial"></div>

    <!-- Мобильное управление -->
    <div class="mobile-ui" id="mobile-ui">
      <div class="stick-zone" id="stick-zone">
        <div class="stick-base" id="stick-base"><div class="stick-knob" id="stick-knob"></div></div>
      </div>
      <div class="touch-buttons">
        <button class="tbtn tbtn-jump" data-touch="jump">▲</button>
        <button class="tbtn tbtn-use" data-touch="use"></button>
        <button class="tbtn tbtn-slot" data-touch="slot0"><span class="ico-tnt"></span></button>
        <button class="tbtn tbtn-slot" data-touch="slot1" data-i18n-title="ex.lighter"><span class="ico-lighter"></span></button>
      </div>
    </div>

    <div class="dmg-vignette" id="dmg-vignette"></div>
  </div>

  <!-- ============ ПАУЗА ============ -->
  <div id="screen-pause" class="screen modal">
    <div class="panel">
      <div class="panel-head" data-i18n="pause.title">Пауза</div>
      <button class="btn btn-lg btn-green" data-act="resume" data-i18n="pause.resume">Продолжить</button>
      <button class="btn btn-md btn-blue" data-act="restart" data-i18n="pause.restart">Начать заново</button>
      <button class="btn btn-md btn-blue" data-act="settings" data-i18n="pause.settings">Настройки</button>
      <button class="btn btn-md btn-red" data-act="quit" data-i18n="pause.quit">В меню</button>
    </div>
  </div>

  <!-- ============ УРОВЕНЬ ПРОЙДЕН ============ -->
  <div id="screen-complete" class="screen modal">
    <div class="panel panel-win">
      <div class="win-head" data-i18n="win.title">Уровень пройден!</div>
      <div class="win-stars">
        <div class="wstar" data-i="0">★</div>
        <div class="wstar" data-i="1">★</div>
        <div class="wstar" data-i="2">★</div>
      </div>
      <div class="win-rows">
        <div class="win-row"><span data-i18n="win.crystals">Кристаллы</span><b id="win-crystals">5/5</b></div>
        <div class="win-row"><span data-i18n="win.tnt">Зарядов</span><b id="win-tnt">2/4</b></div>
        <div class="win-row"><span data-i18n="win.blocks">Разрушено</span><b id="win-blocks">0</b></div>
        <div class="win-row big"><span data-i18n="win.score">Очки</span><b id="win-score">0</b></div>
      </div>
      <button class="btn btn-lg btn-green" data-act="next" data-i18n="win.next">Следующий уровень</button>
      <div class="btn-row">
        <button class="btn btn-md btn-blue" data-act="restart" data-i18n="win.repeat">Повторить</button>
        <button class="btn btn-md btn-blue" data-act="quit" data-i18n="win.menu">Меню</button>
      </div>
    </div>
  </div>

  <!-- ============ НАСТРОЙКИ ============ -->
  <div id="screen-settings" class="screen modal">
    <div class="panel">
      <div class="panel-head" data-i18n="set.title">Настройки</div>
      <div class="set-row">
        <label data-i18n="set.lang">Язык</label>
        <div class="seg" data-setting="lang">
          <button data-val="ru">Русский</button><button data-val="en">English</button>
        </div>
      </div>
      <div class="set-row">
        <label data-i18n="set.quality">Качество графики</label>
        <div class="seg" data-setting="quality">
          <button data-val="low" data-i18n="set.low">Низ</button
          ><button data-val="medium" data-i18n="set.med">Сред</button
          ><button data-val="high" data-i18n="set.high">Выс</button>
        </div>
      </div>
      <div class="set-row">
        <label data-i18n="set.volume">Громкость</label>
        <input type="range" min="0" max="100" value="80" data-setting="volume">
      </div>
      <div class="set-row">
        <label data-i18n="set.music">Музыка</label>
        <input type="range" min="0" max="100" value="45" data-setting="music">
      </div>
      <div class="set-row">
        <label data-i18n="set.sensitivity">Чувствительность</label>
        <input type="range" min="20" max="250" value="100" data-setting="sensitivity">
      </div>
      <div class="set-row">
        <label data-i18n="set.shake">Тряска камеры</label>
        <input type="range" min="0" max="150" value="100" data-setting="shake">
      </div>
      <div class="set-row">
        <label data-i18n="set.slowmo">Замедление времени</label>
        <div class="seg" data-setting="slowmo">
          <button data-val="0" data-i18n="set.off">Выкл</button><button data-val="1" data-i18n="set.on">Вкл</button>
        </div>
      </div>
      <div class="set-row">
        <label data-i18n="set.haptics">Вибрация</label>
        <div class="seg" data-setting="haptics">
          <button data-val="0" data-i18n="set.off">Выкл</button><button data-val="1" data-i18n="set.on">Вкл</button>
        </div>
      </div>
      <div class="set-row">
        <label data-i18n="set.invert">Инверсия Y</label>
        <div class="seg" data-setting="invertY">
          <button data-val="0" data-i18n="set.off">Выкл</button><button data-val="1" data-i18n="set.on">Вкл</button>
        </div>
      </div>
      <button class="btn btn-lg btn-green" data-act="closesettings" data-i18n="set.done">Готово</button>
    </div>
  </div>

  <!-- ============ REWARDED ============ -->
  <div id="screen-reward" class="screen modal">
    <div class="panel">
      <div class="panel-head" data-i18n="rw.title">Заряды закончились</div>
      <p class="panel-text" data-i18n="rw.text" data-i18n-html>—</p>
      <button class="btn btn-lg btn-green btn-ad" data-act="reward">
        <span class="ad-mark" data-i18n="ad.mark">Реклама</span>
        <span data-i18n="ad.watch">Смотреть рекламу</span>
        <span class="reward-chip">+1<span class="ico ico-tnt"></span></span>
      </button>
      <div class="btn-row">
        <button class="btn btn-md btn-blue" data-act="restart" data-i18n="win.repeat">Повторить</button>
        <button class="btn btn-md btn-red" data-act="quit" data-i18n="win.menu">Меню</button>
      </div>
    </div>
  </div>

  <div id="flyers"></div>
  <div id="rotate-hint" data-i18n="rotate">Поверни устройство горизонтально 🔄</div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
<noscript>JavaScript required.</noscript>
</body>
</html>
